name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip gettext \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Debug autopoint
        run: |
          dpkg -L gettext | grep -i autopoint || echo "not in gettext package"
          apt list --installed 2>/dev/null | grep gettext
          find / -name "autopoint*" 2>/dev/null

      - name: Install buildozer
        run: pip install --upgrade buildozer cython

      - name: Build APK
        run: |
          export AUTOPOINT=true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveGoldAI-APK
          path: bin/*.apk
